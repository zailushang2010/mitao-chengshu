[package]
name = "suiji_potplayer"
version = "0.2.0"
edition = "2021"
description = "随机从本地片库开启多部电影到 PotPlayer 并网格平铺"
authors = ["suijiPotPlayer"]

[dependencies]
eframe = { version = "0.31", default-features = true }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tray-icon = "0.19"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_SystemServices",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
