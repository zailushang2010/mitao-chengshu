[package]
name = "mitao_chengshu"
version = "0.6.2"
edition = "2021"
description = "蜜桃成熟 — 随机从本地片库开启多部电影到 PotPlayer 并网格平铺"
authors = ["蜜桃成熟 contributors"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/zailushang2010/mitao-chengshu"
homepage = "https://github.com/zailushang2010/mitao-chengshu"
keywords = ["potplayer", "media", "random", "windows", "egui"]
categories = ["multimedia", "gui"]

[[bin]]
name = "蜜桃成熟"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = true }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "ico"] }
tray-icon = "0.19"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_SystemServices",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
